# opensuse.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of openSUSE Leap
# from the official DVD/NET install ISO, driven natively by caked/caker after
# booting from the ISO (see the "PackerLite" section of the wiki's command
# summary). This is the default template auto-selected for an ISO whose
# filename/URL contains "opensuse" (GRPCLib.SupportedPlatform detection) when
# --autoinstall is passed without an explicit --template — pass --template
# yourself to override it. Unlike the bundled macOS templates, this one is NOT
# a guaranteed-working recipe: it has been reviewed for plausibility against
# the documented YaST install flow, but NOT validated end-to-end against a
# real boot, and with less confidence than the Anaconda-family templates
# (fedora/centos/redhat) in this same directory — YaST's
# exact screen labels/order have shifted more across Leap releases than
# Anaconda's have. Treat the click targets and tab counts below as a first
# draft to verify/adjust against your own run.
#
# openSUSE's installer is YaST, not Anaconda — different installer, different
# flow. Like CentOS Stream/RHEL, the DVD/NET ISO boots straight into the
# graphical installer, no live desktop session needed first.
#
# This template picks "Desktop with KDE Plasma" at the System Role screen —
# change that click target to "Desktop with GNOME" (or another listed role)
# if you want something else. Unlike the Anaconda-family templates, YaST asks
# for the desktop up front as an explicit choice rather than leaving it to a
# separate, easy-to-miss Software Selection spoke.
#
# This template assumes no "Registration"/"Extension and Module Selection"
# screen appears between Welcome and System Role — true for openSUSE Leap's
# community media in most recent releases, unlike SUSE Linux Enterprise. If
# your build does show one, insert a step to dismiss it before System Role.
#
# Usage:
#   cakectl build my-opensuse-vm ./openSUSE-Leap-15.6-DVD-x86_64-Media.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m # a full install can legitimately take 20-30+ minutes
ignore_ip: true
required_variables:
  - username
  - password
  - hostname

pre_boot_command:
  - title: Boot Menu
    commands:
      - <locate text="Install" timeout=30>
      - <enter>

boot_command:
  - title: Select a mode
    commands:
      - <skipCommandIfNotFound text="Select a mode" timeout=90>
      - <tab repeat=6>
      - <spacebar>
      - <tab>
      - <spacebar>
      - <tab>
      - <spacebar>
      - <tab repeat=2>
      - <spacebar>

  - title: Wait installation to start
    commands:
      - <locate text="Take a moment to review the installation settings" timeout=90>

  - title: Create user account
    commands:
      - <click text="Authentication" timeout=30>

  - title: Select keyboard layout
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Fill in user account
    commands:
      - <click text="Define an administrator user">
      - <locate text="Full name">
      - <tab>
      - ${var.username}
      - <tab>
      - ${var.username}
      - <tab>
      - ${var.password}
      - <tab repeat=2>
      - ${var.password}
      - <tab repeat=4>
      - <enter>
      - <wait2s>
      - <leftSuperOn>
      - <left>
      - <leftSuperOff>

  - title: Start installation
    commands:
      - <click text="Install now">

  - title: Confirmation
    commands:
      - <click text="Confirm and install">

  - title: Wait installation to complete
    commands:
      - <locate text="Installation complete" timeout=1800>
      - <tab repeat=5> # 642,396
      - <spacebar>

  - title: Installation complete, log in and enable SSH
    commands:
      - <locate text="login" timeout=120>
      - <wait5s>
      - ${var.username}
      - <enter>
      - <wait1s>
      - ${var.password}
      - <enter>
      - <wait1s>
      - sudo systemctl enable --now sshd
      - <enter>
      - <wait1s>
      - ${var.password}
      - <enter>
      - <wait1s>
      - sudo systemctl start sshd
      - <enter>
      - <wait1s>

post_boot_command:
  use_ssh_key: false
  commands:
    - mkdir -p /home/${var.username}/.ssh
    - |
      cat >> /home/${var.username}/.ssh/authorized_keys <<EOF
      ${var.ssh_authorized_key}
      EOF
    - "echo ${var.password} | sudo -S sh -c 'echo \"${var.username} ALL=(ALL:ALL) NOPASSWD: ALL\" > /etc/sudoers.d/${var.username}'"
    - sudo semanage fcontext -a -t initrc_exec_t '/usr/bin/cakeagent'
    - sudo restorecon -v /usr/local/bin/cakeagent
    - sudo systemctl restart cakeagent
    - sudo zypper addrepo https://download.opensuse.org/repositories/Cloud:Tools/16.0/Cloud:Tools.repo
    - sudo zypper --gpg-auto-import-keys refresh
    - sudo zypper update -y
    - sudo zypper clean -a
    - sudo semanage fcontext -a -t initrc_exec_t '/usr/bin/cakeagent'
    - sudo restorecon -v /usr/local/bin/cakeagent
    - sudo zypper install -y cloud-init
    - sudo systemctl enable cloud-init-local.service
    - sudo systemctl enable cloud-init.service
    - sudo systemctl enable cloud-config.service
    - sudo systemctl enable cloud-final.service
    - "sudo sh -c 'echo \"datasource_list: [ NoCloud, None ]\" > /etc/cloud/cloud.cfg.d/100_datasources.cfg'"
    - |
      sudo sh -c 'mkdir -p /etc/systemd/resolved.conf.d && cat > /etc/systemd/resolved.conf.d/10-compose-dns.conf' <<'EOF'
      [Resolve]
      DNS=${var.dnsIP}:${var.dnsPort}
      Domains=${var.domain}
      EOF
    - sudo systemctl enable systemd-resolved || true
    - sudo systemctl restart systemd-resolved || true
    - |
      sudo sh <<'EOS'
      D="${var.domain}"
      G="${var.dnsIP}"
      # vmnet's DHCP server announces the domain "guest": keep it out of the search list so the
      # default domain is the compose one, whichever network stack the guest uses.
      mkdir -p /etc/systemd/networkd.conf.d
      cat > /etc/systemd/networkd.conf.d/10-compose-dns.conf <<'EOF'
      [DHCPv4]
      UseDomains=no
      [DHCPv6]
      UseDomains=no
      EOF
      if [ -f /etc/dhcp/dhclient.conf ] && ! grep -q 'compose-dns' /etc/dhcp/dhclient.conf; then
        printf '# compose-dns\nsupersede domain-name "%s";\nsupersede domain-search "%s";\n' "$D" "$D" >> /etc/dhcp/dhclient.conf
      fi
      if command -v nmcli >/dev/null 2>&1 && systemctl is-active NetworkManager >/dev/null 2>&1; then
        IFACE=$(ip route get "$G" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')
        CON=$(nmcli -g GENERAL.CONNECTION device show "$IFACE" 2>/dev/null)
        if [ -n "$CON" ]; then
          nmcli connection modify "$CON" ipv4.ignore-auto-dns yes ipv4.dns "$G" ipv4.dns-search "$D" ipv6.ignore-auto-dns yes ipv6.dns-search "$D" || true
          nmcli device reapply "$IFACE" || true
        fi
      fi
      if systemctl is-active systemd-networkd >/dev/null 2>&1; then
        systemctl restart systemd-networkd || true
      fi
      EOS
