# linux-ubuntu-server.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of Ubuntu Server
# from its own install ISO, driven natively by caked/caker after booting
# from the ISO (see the "PackerLite" section of the wiki's command summary).
# This is the default template auto-selected for a non-desktop Ubuntu ISO
# (GRPCLib.SupportedPlatform detection) when --autoinstall is passed without
# an explicit --template — pass --template yourself to override it. Unlike
# the bundled macOS templates, this one is NOT a guaranteed-working recipe:
# it has been reviewed for plausibility, but NOT validated end-to-end
# against a real boot. Treat the prompts and answers below as a first draft
# to verify/adjust against your own run.
#
# Ubuntu Server's ISO already ships its own unattended-install mechanism
# (cloud-init/subiquity's "autoinstall" boot option) rather than a scripted
# prompt sequence like Alpine's `setup-alpine` or a click-through installer
# like Anaconda — this template's job is mostly to select the right keyboard
# layout and the GRUB "Install" entry, then wait for subiquity's own
# autoinstall flow to run to completion on its own.
#
# Usage:
#   cakectl build my-ubuntu-vm ./ubuntu-24.04-live-server-amd64.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m # a full install can legitimately take 20-30+ minutes
install_agent: false

pre_boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Boot the GRUB menu's default "Install" entry
    commands:
    - <locate text="GRUB" timeout=30>
    - <enter>

boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Wait for prompt to install
    commands:
      - <locate text="Continue with autoinstall" timeout=600>
      - yes
      - <enter>

  - title: Wait install to complete
    commands:
      - '<locate text="login:" timeout=1200>'
