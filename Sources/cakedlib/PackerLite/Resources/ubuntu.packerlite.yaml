# linux-ubuntu.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of Ubuntu Desktop
# from its own install ISO, driven natively by caked/caker after booting
# from the ISO (see the "PackerLite" section of the wiki's command summary).
# This is the default template auto-selected for a desktop Ubuntu ISO
# (GRPCLib.SupportedPlatform detection, matched against the URL/filename
# the same way Fedora Workstation's is) when --autoinstall is passed without
# an explicit --template — pass --template yourself to override it. Unlike
# the bundled macOS templates, this one is NOT a guaranteed-working recipe:
# it has been reviewed for plausibility, but NOT validated end-to-end
# against a real boot. Treat the prompts and answers below as a first draft
# to verify/adjust against your own run.
#
# Ubuntu Desktop's ISO ships the same cloud-init/subiquity "autoinstall"
# unattended-install mechanism as Ubuntu Server, just reached through the
# graphical live-session installer rather than a text UI — this template's
# job is mostly to select the right keyboard layout and the GRUB "Install"
# entry, then wait for the installer's own autoinstall flow to run to
# completion on its own.
#
# Usage:
#   cakectl build my-ubuntu-vm ./ubuntu-24.04-desktop-amd64.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m # a full install can legitimately take 20-30+ minutes
install_agent: false
required_variables:
  - username
  - password
  - hostname

pre_boot_command:
  - title: Boot the GRUB menu's default "Install" entry
    commands:
    - <locate text="GRUB" timeout=30>
    - <enter>

boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Wait for prompt to install
    commands:
      - <locate text="Review your choice" timeout=600>
      - <tab>
      - <spacebar>

  - title: Wait install to complete
    commands:
      - <locate text="Not listed?" timeout=1200>
