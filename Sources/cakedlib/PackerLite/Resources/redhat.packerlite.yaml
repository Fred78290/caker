# redhat.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of Red Hat
# Enterprise Linux from the official install ISO, driven natively by
# caked/caker after booting from the ISO (see the "PackerLite" section of the
# wiki's command summary). This is the default template auto-selected for an
# ISO whose filename/URL contains "rhel" or "redhat" (GRPCLib.SupportedPlatform
# detection) when --autoinstall is passed without an explicit --template —
# pass --template yourself to override it. Unlike the bundled macOS templates,
# this one is NOT a guaranteed-working recipe: it has been reviewed for
# plausibility against the documented Anaconda install flow, but NOT validated
# end-to-end against a real boot. Treat the click targets and tab counts below
# as a first draft to verify/adjust against your own run.
#
# Requires a RHEL ISO from your own Red Hat subscription/developer account —
# caker does not provide or download one for you.
#
# Like CentOS Stream (same Anaconda installer family), the RHEL ISO boots
# straight into the graphical installer — no live desktop session, no
# `liveinst` step needed first.
#
# RHEL's hub has one extra spoke CentOS Stream doesn't: "Connect to Red Hat"
# (subscription-manager registration). It's optional and doesn't block
# "Begin Installation" if left unvisited, so this template skips it — register
# the system yourself after first boot (`subscription-manager register`) if
# you need entitlements during the install itself (e.g. to select certain
# add-ons), that's beyond what boot_command automation should attempt.
#
# The boot ISO's default software selection is a minimal server install with
# no desktop environment. If you want a desktop, open the "Software Selection"
# hub spoke and pick "Server with GUI"/"Workstation" — this template leaves
# that spoke untouched and takes whatever the ISO's default selection is.
#
# Usage:
#   cakectl build my-rhel-vm ./rhel-10.*-x86_64-dvd.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m        # a full install can legitimately take 20-30+ minutes
ignore_ip: true
required_variables:
  - redhat_username
  - redhat_password

pre_boot_command:
  - title: Boot the GRUB menu's default "Install" entry
    commands:
      - <locate text="GRUB" timeout=30>
      - <enter>

  - title: Wait Anaconda to start
    commands:
      - <locate text="when reporting a bug" timeout=180>
      - <wait10s>

boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Choose langue
    commands:
      - <locate text="RED HAT ENTERPRISE">
      - english
      - <enter>
      - <wait1s>
      - <tab repeat=6>
      - <enter>
      - <wait2s>

  - title: Connect to Red Hat Subscription
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="Connect to Red Hat">
      - <wait1s>
      - <locate text="Authentication">
      - <wait1s>
      - <tab repeat=2>
      - ${var.redhat_username}
      - <tab>
      - ${var.redhat_password}
      - <tab repeat=3>
      - <spacebar>
      - <wait1s>
      - <tab repeat=4>
      - <spacebar>
      - <locate text="The system is registered" timeout=60>
      - <click text="Done">
      - <wait1s>

  - title: Create user account
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="User Creation">
      - <wait1s>

  - title: Fill user account information
    commands:
      - <locate text="CREATE USER">
      - <wait1s>
      - ${var.username}
      - <tab>
      - ${var.username}
      - <tab repeat=3>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <click text="Done">
      - <wait1s>

  - title: Confirm password
    commands:
      - <skipCommandIfNotFound text="Press done again to use the password anyway">
      - <click text="Done">
      - <wait1s>

  - title: Configure hostname and network
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="Network & Host Name">
      - <locate text="Hardware Address">
      - <tab repeat=5>
      - ${var.hostname}
      - <tab>
      - <spacebar>
      - <wait1s>
      - <click text="Done">
      - <wait1s>

  - title: Installation Destination
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="Installation Destination">
      - <locate text="Device Selection">
      - <wait1s>
      - <click text="Done">
      - <wait1s>

  - title: Selection software
    commands:
      - <skipCommandIfNotFound text="Source changed" timeout=60>
      - <click text="Software Selection">
      - <wait1s>
      - <down repeat=2>
      - <spacebar>
      - <wait1s>
      - <click text="Done">
      - <wait1s>

  - title: Begin Installation
    commands:
      - <click text="Begin Installation">

  - title: Wait installed and ready for you to use!
    commands:
      - <locate text="now successfully installed and ready for you to use!" timeout=1200>

  - title: Reboot System
    commands:
      - <click text="Reboot System">
