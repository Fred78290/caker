# vanilla-macos26.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required.
#
# Usage:
#   cakectl build my-vm https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-65618/10445B26-DE2C-43EC-9149-0A831602E74B/UniversalMac_26.6_25G72_Restore.ipsw \
#     --user admin --password admin \
#     --macos-version macos26
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m

boot_command:
  - title: Wait hello, hola, bonjour, etc.
    commands:
      - <locate timeout=60 text="Continue">
      - <spacebar>

  - title: Select Language
    commands:
      - <locate timeout=60 text='https://www.apple.com/'>
      - italiano
      - <esc>
      - english
      - <down>
      - <enter>
      - <wait20s>

  - title: Select Your Country or Region
    commands:
      - <click timeout=60 text='Select Your Country or Region'>
      - united states
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Transfer Your Data to This Mac
    commands:
      - <locate timeout=60 text='Transfer Your Data to This Mac'>
      - <wait1s>
      - <tab repeat=3>
      - <spacebar>
      - <tab repeat=2>
      - <spacebar>

  - title: Written and Spoken Languages
    commands:
      - <locate text='Written and Spoken Languages'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Accessibility
    commands:
      - <locate timeout=60 text='Accessibility'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Data & Privacy
    commands:
      - <locate timeout=60 text='Data & Privacy'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Create a Mac Account
    commands:
      - <locate timeout=60 text='Create a Mac Account'>
      - <wait1s>
      - <tab repeat=6>
      - Managed via Caker
      - <tab>
      - ${var.username}
      - <tab>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab repeat=2>
      - <spacebar>
      - <tab repeat=2>
      - <spacebar>
      - <locate timeout=60 text='Sign In to Your Apple Account'>
      - <wait1s>
      - <locate timeout=60 text='Email or Phone Number'>
      - <wait1s>
      - <locate timeout=60 text='Other Sign'>
      - <wait1s>

  - title: Enable Voice Over
    commands:
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <wait5s>

  - title: Sign In with Your Apple ID
    commands:
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>
      - <up>
      - <spacebar>

  - title: Are you sure you want to skip signing in with an Apple ID?
    commands:
      - <locate timeout=60 text='Skip'>
      - <wait1s>
      - <tab>
      - <spacebar>

  - title: Terms and Conditions
    commands:
      - <locate timeout=60 text='Terms and Conditions'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: I have read and agree to the macOS Software License Agreement
    commands:
      - <wait2s>
      - <tab>
      - <spacebar>

    # Age Range -> Adult
  - title: Age Range -> Adult
    commands:
      - <locate timeout=60 text='Age Range'>
      - <wait1s>
      - <tab repeat=3>
      - <spacebar>

  - title: Enable Location Services
    commands:
      - <locate timeout=60 text='Enable Location Services'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you don't want to use Location Services?
    commands:
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Select Your Time Zone
    commands:
      - <locate timeout=60 text='Select Your Time Zone'>
      - <wait1s>
      - <tab repeat=3>
      - UTC
      - <enter>
      - <tab repeat=2>
      - <spacebar>

  - title: Analytics
    commands:
      - <locate timeout=60 text='Analytics'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Screen Time
    commands:
      - <locate timeout=60 text='Screen Time'>
      - <wait1s>
      - <tab repeat=2>
      - <spacebar>

  - title: Siri
    commands:
      - <skipNotFound timeout=10 text='Siri'>
      - <wait1s>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>
    
  - title: Your Mac is Ready for FileVault
    commands:
      - <locate timeout=60 text='Your Mac is Ready for FileVault'>
      - <wait1s>
      - <leftShiftOn>
      - <tab repeat=2>
      - <leftShiftOff>
      - <spacebar>

  - title: Mac Data Will Not Be Securely Encrypted
    commands:
      - <wait1s>
      - <tab>
      - <spacebar>

  - title: Choose Your Look
    commands:
      - <locate timeout=60 text='Choose Your Look'>
      - <wait1s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Update Mac Automatically
    commands:
      - <locate timeout=60 text='Update Mac Automatically'>
      - <wait1s>
      - <tab repeat=2>
      - <spacebar>

  - title: Disable Voice Over
    commands:
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>

  - title: Welcome to Mac
    commands:
      - <locate timeout=60 text="Get Started">
      - <spacebar>

  - title: Now that the installation is done, open "Applications folder"
    commands:
      - <wait10s>
      - <leftAltOn>
      - <leftShiftOn>
      - a
      - <leftShiftOff>
      - <leftAltOff>
      - <wait1s>
      - System Preferences
      - <wait1s>
      - <leftAltOn>
      - o
      - <leftAltOff>

  - title: Navigate to Sharing
    commands:
      - <locate text='Software Update'>
      - <wait1s>
      - <leftCtrlOn>
      - <fnOn>
      - <f2>
      - <fnOff>
      - <leftCtrlOff>
      - <right repeat=3>
      - <down>
      - Sharing
      - <enter>

  - title: Enable Voice Over
    commands:
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <wait5s>
      - v

  - title: Navigate to "Screen Sharing" and enable it
    commands:
      - <locate text='Screen Sharing'>
      - <wait2s>
      - <tab repeat=5>
      - <spacebar>

  - title: Type in the password to allow enabling Screen Sharing
    commands:
      - <wait5s>
      - ${var.password}
      - <enter>

  - title: Navigate to "Remote Login" and enable it
    commands:
      - <wait2s>
      - <tab repeat=12>
      - <spacebar>

  - title: Disable Voice Over
    commands:
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <wait5s>

  - title: Quit System Settings
    commands:
      - <wait5s>
      - <leftAltOn>
      - q
      - <leftAltOff>
