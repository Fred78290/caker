# linux-centos.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of CentOS Stream
# from the official install ISO, driven natively by caked/caker after booting
# from the ISO (see the "PackerLite" section of the wiki's command summary).
# This is the default template auto-selected for an ISO whose filename/URL
# contains "centos" (GRPCLib.SupportedPlatform detection) when --autoinstall
# is passed without an explicit --template — pass --template yourself to
# override it. Unlike the bundled macOS templates, this one is NOT a
# guaranteed-working recipe: it has been reviewed for plausibility against the
# documented Anaconda install flow, but NOT validated end-to-end against a
# real boot. Treat the click targets and tab counts below as a first draft to
# verify/adjust against your own run.
#
# Unlike Fedora Workstation's Live ISO, CentOS Stream's install ISO boots
# straight into the graphical Anaconda installer — there's no live desktop
# session and no `liveinst` step needed first.
#
# The boot ISO's default software selection is a minimal server install with
# no desktop environment. If you want a desktop, open the "Software Selection"
# hub spoke and pick "Server with GUI"/"Workstation" (or use the DVD ISO,
# whose default selection may already include one) — this template leaves
# that spoke untouched and takes whatever the ISO's default selection is.
#
# Usage:
#   cakectl build my-centos-vm ./CentOS-Stream-9-latest-x86_64-dvd1.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m # a full install can legitimately take 20-30+ minutes

pre_boot_command:
  - title: Wait GRUB
    commands:
      - <locate text="GRUB" timeout=30>
      - <enter>

  - title: Wait Anaconda to start
    commands:
      - <locate text="when reporting a bug" timeout=180>
      - <wait10s>

boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Choose langue
    commands:
      - <locate text="CENTOS STREAM">
      - english
      - <enter>
      - <wait1s>
      - <tab repeat=6>
      - <enter>
      - <wait2s>

  - title: Create user account
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="User Creation">
      - <wait1s>

  - title: Fill user account information
    commands:
      - <locate text="CREATE USER">
      - <wait1s>
      - ${var.username}
      - <tab>
      - ${var.username}
      - <tab repeat=3>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <click text="Done">
      - <wait1s>

  - title: Confirm password
    commands:
      - <skipCommandIfNotFound text="Press done again to use the password anyway">
      - <click text="Done">

  - title: Installation Destination
    commands:
      - <wait1s>
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="Installation Destination">
      - <locate text="Device Selection">
      - <wait1s>
      - <click text="Done">
      - <wait1s>

  - title: Begin Installation
    commands:
      - <click text="Begin Installation">

  - title: Wait installed and ready for you to use!
    commands:
      - <locate text="CentOS Stream is now successfully installed and ready for you to use!" timeout=1200>

  - title: Reboot System
    commands:
      - <click text="Reboot System">
