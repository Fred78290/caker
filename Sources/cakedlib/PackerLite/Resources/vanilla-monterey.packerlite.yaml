# vanilla-monterey.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required.
#
# Usage:
#   cakectl build my-vm https://.../UniversalMac_12.7.6_21H1320_Restore.ipsw \
#     --user admin --password admin \
#     --macos-version monterey
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m

boot_command:
  - title: Wait hello, hola, bonjour, etc.
    commands: 
      - <wait10s>
      - <spacebar>

  - title: Select Language
    commands: 
      - <wait10s>
      - <esc>
      - english
      - <down>
      - <enter>

  - title: Select Your Country and Region
    commands: 
      - <wait30s>
      - united states
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Written and Spoken Languages
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Change keyboard
    commands: 
      - <keyboard 'com.apple.keylayout.US'>

  - title: Accessibility
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Data & Privacy
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Migration Assistant
    commands: 
      - <wait10s>
      - <tab>
      - <tab>
      - <tab>
      - <spacebar>

  - title: Sign In with Your Apple ID
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you want to skip signing in with an Apple ID?
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>

  - title: Terms and Conditions
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: I have read and agree to the macOS Software License Agreement
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>

  - title: Create a Computer Account
    commands: 
      - <wait10s>
      - ${var.username}
      - <tab>
      - <tab>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <tab>
      - <tab>
      - <spacebar>

  - title: Enable Location Services
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you don't want to use Location Services?
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>

  - title: Select Your Time Zone
    commands: 
      - <wait10s>
      - <tab>
      - UTC
      - <enter>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Analytics
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Screen Time
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>

  - title: Siri
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Choose Your Look
    commands: 
      - <wait10s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Enable Voice Over
    commands: 
      - <wait10s>
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <wait5s>
      - v

  - title: Now that the installation is done, open "System Preferences"
    commands: 
      - <wait10s>
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - System Preferences
      - <enter>

  - title: Navigate to "Sharing"
    commands: 
      - <wait10s>
      - sharing
      - <enter>

  - title: Enable Screen Sharing
    commands: 
      - <wait10s>
      - <tab>
      - <tab>
      - <tab>
      - <tab>
      - <spacebar>

  - title: Enable Remote Login
    commands: 
      - <wait10s>
      - <down>
      - <down>
      - <down>
      - <down>
      - <spacebar>
      - <tab>
      - <tab>
      - <spacebar>

  - title: Disable Voice Over
    commands: 
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
