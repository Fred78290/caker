# vanilla-alpine324.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of Alpine Linux 3.24
# from the official standard/virt install ISO, driven natively by caked/caker
# after booting from the ISO (see the "PackerLite" section of the wiki's
# command summary). This is the default template auto-selected for an ISO
# whose filename/URL identifies it as Alpine (GRPCLib.SupportedPlatform
# detection) when --autoinstall is passed without an explicit --template —
# pass --template yourself to override it. Unlike the bundled macOS templates,
# this one is NOT a guaranteed-working recipe: it has been reviewed for
# plausibility against the documented `setup-alpine` install flow, but NOT
# validated end-to-end against a real boot. Treat the prompts and answers
# below as a first draft to verify/adjust against your own run.
#
# Alpine's ISO boots straight to a root shell (no graphical installer, no
# Anaconda-style hub/spoke) — the whole install is driven by running the
# interactive `setup-alpine` script and answering its prompts in sequence:
# keyboard layout/variant, hostname, network interfaces, root password,
# timezone, proxy, NTP client, APK mirror, one non-root user account, SSH
# server choice, and finally disk selection/mode (`sys`, whole-disk).
#
# After the post-install reboot, this template also uncomments the first
# HTTP mirror in /etc/apk/repositories (commented out by default), runs
# `apk update`, installs `sudo`, and grants the created user passwordless
# sudo before rebooting once more — none of that is part of `setup-alpine`
# itself.
#
# Usage:
#   cakectl build my-alpine-vm ./alpine-virt-3.24.*-x86_64.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m # a full install can legitimately take 20-30+ minutes

pre_boot_command:
  - title: Boot the GRUB menu's default "Install" entry
    commands:
      - <locate text="GRUB" timeout=30>
      - <enter>

boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Wait for prompt to login
    commands:
      - <locate text="localhost login:" timeout=30>
      - root
      - <enter>

  - title: Wait log in to complete
    commands:
      - <locate text="You can setup the system with the command">
      - setup-alpine
      - <enter>

  - title: Select keyboard layout
    commands:
      - <locate text="Select keyboard layout">
      - us
      - <enter>

  - title: Select keyboard variant
    commands:
      - <locate text="Select variant">
      - us-mac
      - <enter>

  - title: Set hostname
    commands:
      - <locate text="Enter system hostname">
      - ${var.username}-vm
      - <enter>

  - title: Select ethernet interface
    commands:
      - <skipNotFound text="Available interfaces are: eth0 eth1">
      - <enter>

  - title: Configure eth0
    commands:
      - <locate text="IPv4 address for eth0">
      - <enter>
      - <locate text="IPv6 address for eth0">
      - <enter>

  - title: Configure eth1 if present
    commands:
      - <skipNotFound text="Available interfaces are: eth1">
      - done
      - <enter>
      - <locate text="Do you want to do any manual network configuration" timeout=30>
      - y
      - <enter>
      - <wait2s>
      - <down repeat=7>
      - i
      - <enter>
      - auto eth1
      - <enter>
      - iface eth1 inet dhcp
      - <enter>
      - iface eth1 inet6 auto
      - <enter>
      - <escape>
      - <leftShiftOn>
      - zz
      - <leftShiftOff>

  - title: Change password for root
    commands:
      - <locate text="Changing password for root" timeout=30>
      - ${var.password}
      - <enter>
      - <locate text="Retype password for">
      - ${var.password}
      - <enter>

  - title: Select time zone
    commands:
      - <locate text="Which timezone are you in">
      - <enter>

  - title: Ignore proxy configuration
    commands:
      - <locate text="HTTP/FTP proxy URL">
      - <enter>

  - title: Setup NTP client
    commands:
      - <locate text="Which NTP client to run">
      - <enter>

  - title: Select APK mirror
    commands:
      - <locate text="Enter mirror number or URL">
      - <enter>

  - title: Create user account
    commands:
      - <locate text="Setup a user">
      - ${var.username}
      - <enter>
      - <locate text="Full name for user">
      - <enter>
      - <locate text="Changing password for ${var.username}">
      - ${var.password}
      - <enter>
      - <locate text="Retype password">
      - ${var.password}
      - <enter>
      - <locate text="Enter SSH key or URL">
      - <enter>

  - title: Configure SSH server
    commands:
      - <locate text="Which ssh server">
      - <enter>

  - title: Configure Disk
    commands:
      - <locate text="Which disk(s) would you like to use">
      - vda
      - <enter>
      - <locate text="How would you like to use it">
      - sys
      - <enter>
      - <locate text="Erase the above disk">
      - y
      - <enter>

  - title: Wait for installation to complete
    commands:
      - <locate text="Installation is complete" timeout=600>
      - reboot
      - <enter>

  - title: Wait login prompt after reboot
    commands:
      - <locate text="login" timeout=60>
      - root
      - <enter>
      - <locate text="Password:">
      - ${var.password}
      - <locate text="Welcome to Alpine">
      - sed -i '/^#http/s/^#//' /etc/apk/repositories
      - <enter>
      #- sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
      #- sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
      - apk update
      - <enter>
      - <locate text="distinct packages available" timeout=60>
      - apk add sudo
      - <enter>
      - echo "${var.username} ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/${var.username}
      - <enter>
      - reboot
