# vanilla-sequoia.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required (see vanilla-sequoia.pkr.hcl
# for the equivalent Packer-based recipe this was transcribed from).
#
# Usage:
#   cakectl build my-vm https://.../UniversalMac_26.6_25G72_Restore.ipsw \
#     --user admin --password admin \
#     --template templates/macos/vanilla-sequoia.packerlite.yaml
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# How long to wait after the VM starts before sending the first keystroke.
create_grace_time: 30s
# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m

boot_command:
  - title: Wait hello, hola, bonjour, etc.
    commands: 
      - <wait10s>
      - <spacebar>

  - title: Select Language
    commands: 
      - <wait10s>
      - italiano
      - <esc>
      - english
      - <down>
      - <enter>

  - title: Select Your Country or Region
    commands: 
      - <click timeout=30 text='Select Your Country or Region'>
      - <wait5s>
      - united states
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Transfer Your Data to This Mac
    commands:
      - <locate timeout=30 text='Transfer Your Data to This Mac'>
      - <tab repeat=3>
      - <spacebar>
      - <tab repeat=2>
      - <spacebar>

  - title: Written and Spoken Languages
    commands: 
      - <locate text='Written and Spoken Languages'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Change keyboard
    commands: 
      - <keyboard 'com.apple.keylayout.US'>

  - title: Accessibility
    commands: 
      - <locate text='Accessibility'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Data & Privacy
    commands: 
      - <locate text='Data & Privacy'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Create a Mac Account
    commands: 
      - <locate text='Create a Mac Account'>
      - Managed via Caker
      - <tab>
      - ${var.username}
      - <tab>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <tab>
      - <spacebar>
      - <tab>
      - <tab>
      - <spacebar>
      - <locate timeout=60 text='Sign In to Your Apple Account'>

  - title: Enable Voice Over
    commands:
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <wait10s>

  - title: Sign In with Your Apple ID
    commands: 
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you want to skip signing in with an Apple ID?
    commands: 
      - <wait1s>
      - <tab>
      - <spacebar>

  - title: Terms and Conditions
    commands: 
      - <locate text='Terms and Conditions'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: I have read and agree to the macOS Software License Agreement
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>

  - title: Enable Location Services
    commands: 
      - <locate text='Enable Location Services'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you don't want to use Location Services?
    commands: 
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Select Your Time Zone
    commands: 
      - <locate text='Select Your Time Zone'>
      - <tab>
      - <tab>
      - UTC
      - <enter>
      - <leftShiftOn>
      - <tab>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Analytics
    commands: 
      - <locate text='Analytics'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Screen Time
    commands: 
      - <locate text='Screen Time'>
      - <tab>
      - <spacebar>

  - title: Siri
    commands: 
      - <wait10s>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Choose Your Look
    commands: 
      - <locate text='Choose Your Look'>
      - <spacebar>

  - title: Update Mac Automatically
    commands: 
      - <locate text='Update Mac Automatically'>
      - <tab>
      - <spacebar>

  - title: Welcome to Mac
    commands: 
      - <wait10s>
      - <spacebar>

  - title: Disable Voice Over
    commands: 
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>

  - title: Open System Settings
    commands: 
      - <wait10s>
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - System Settings
      - <enter>

  - title: Navigate to Sharing
    commands: 
      - <wait10s>
      - <tab>
      - remote login
      - <enter>
      - <wait1s>
      - <down>

  - title: Enable Voice Over
    commands: 
      - <wait2s>
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <click 'Do not show this message again'>
      - <wait1s>
      - <click 'Use VoiceOver'>

  - title: Enable Remote login
    commands: 
      - <wait2s>
      - <click 'Administrators'>
      - <tab repeat=5>
      - <spacebar>

  - title: Close Remote Login
    commands: 
      - <tab repeat=7>
      - <spacebar>

  - title: Disable Voice Over
    commands: 
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>

  - title: Quit System Settings
    commands: 
      - <wait10s>
      - <leftAltOn>
      - q
      - <leftAltOff>

  - title: Disable Gatekeeper (1/2)
    commands: 
      - <wait10s>
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - Terminal
      - <enter>

  - title: Disable Gatekeeper (1/2)
    commands: 
      - <wait10s>
      - sudo spctl --global-disable
      - <enter>

  - title: Disable Gatekeeper (1/2)
    commands: 
      - <wait10s>
      - ${var.password}
      - <enter>

  - title: Disable Gatekeeper (1/2)
    commands: 
      - <wait10s>
      - <leftAltOn>
      - q
      - <leftAltOff>

  - title: Disable Gatekeeper (2/2)
    commands: 
      - <wait10s>
      - <tab>
      - Privacy & Security
      - <enter>

  - title: Enable Voice Over
    commands: 
      - <wait2s>
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>

  - title: Disable Gatekeeper (2/2)
    commands: 
      - <wait5s>
      - <tab repeat=28>
      - <down repeat=2>
      - <enter>

  - title: Disable Gatekeeper (2/2)
    commands: 
      - <wait1s>
      - ${var.password}
      - <enter>

  - title: Disable Gatekeeper (2/2)
    commands: 
      - <wait1s>
      - <tab>
      - <spacebar>

  - title: Disable Voice Over
    commands: 
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>

  - title: Quit System Settings
    commands: 
      - <wait10s>
      - <leftAltOn>
      - q
      - <leftAltOff>
