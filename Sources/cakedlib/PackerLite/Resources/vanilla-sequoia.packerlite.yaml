# vanilla-sequoia.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required (see vanilla-sequoia.pkr.hcl
# for the equivalent Packer-based recipe this was transcribed from).
#
# Usage:
#   cakectl build my-vm https://.../UniversalMac_26.6_25G72_Restore.ipsw \
#     --user admin --password admin \
#     --template templates/macos/vanilla-sequoia.packerlite.yaml
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# How long to wait after the VM starts before sending the first keystroke.
create_grace_time: 30s
# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m

boot_command:
  - title: Wait hello, hola, bonjour, etc.
    commands: 
      - <wait10s>
      - <spacebar>

  - title: Select Language
    commands: 
      - <locate timeout=30 text='https://www.apple.com/fr/legal/sla/'>
      - italiano
      - <esc>
      - english
      - <down>
      - <enter>

  - title: Select Your Country or Region
    commands: 
      - <click timeout=30 text='Select Your Country or Region'>
      - <wait5s>
      - united states
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Transfer Your Data to This Mac
    commands:
      - <locate timeout=30 text='Transfer Your Data to This Mac'>
      - <tab repeat=3>
      - <spacebar>
      - <tab repeat=2>
      - <spacebar>

  - title: Written and Spoken Languages
    commands: 
      - <locate text='Written and Spoken Languages'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Change keyboard
    commands: 
      - <keyboard 'com.apple.keylayout.US'>

  - title: Accessibility
    commands: 
      - <locate text='Accessibility'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Data & Privacy
    commands: 
      - <locate text='Data & Privacy'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Create a Mac Account
    commands: 
      - <locate text='Create a Mac Account'>
      - Managed via Caker
      - <tab>
      - ${var.username}
      - <tab>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <tab>
      - <spacebar>
      - <tab>
      - <tab>
      - <spacebar>
      - <locate timeout=60 text='Sign In to Your Apple Account'>

  - title: Enable Voice Over
    commands:
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>
      - <wait10s>

  - title: Sign In with Your Apple ID
    commands: 
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you want to skip signing in with an Apple ID?
    commands: 
      - <wait1s>
      - <tab>
      - <spacebar>

  - title: Terms and Conditions
    commands: 
      - <locate timeout=30 text='Terms and Conditions'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: I have read and agree to the macOS Software License Agreement
    commands: 
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Enable Location Services
    commands: 
      - <locate timeout=30 text='Enable Location Services'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you don't want to use Location Services?
    commands: 
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Select Your Time Zone
    commands: 
      - <locate timeout=30 text='Select Your Time Zone'>
      - <tab>
      - <tab>
      - UTC
      - <enter>
      - <leftShiftOn>
      - <tab>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Analytics
    commands: 
      - <locate timeout=30 text='Analytics'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Screen Time
    commands: 
      - <locate timeout=30 text='Screen Time'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff> 
      - <spacebar>

    # Siri on in european languages, off in US English
  - title: Siri
    commands: 
      - <skipNotFound timeout=10 text='Siri'>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Choose Your Look
    commands: 
      - <locate timeout=30 text='Choose Your Look'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff> 
      - <spacebar>

  - title: Update Mac Automatically
    commands: 
      - <locate timeout=30 text='Update Mac Automatically'>
      - <tab>
      - <spacebar>

  - title: Welcome to Mac
    commands:
      - <wait10s>
      - <spacebar>

  - title: Disable Voice Over
    commands: 
      - <leftAltOn>
      - <fnOn>
      - <f5>
      - <fnOff>
      - <leftAltOff>

  - title: Enable Keyboard navigation so we can navigate System Settings using the keyboard
    commands: 
      - <wait10s>
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - Terminal
      - <wait1s>
      - <enter>

  - title: Enable full keyboard access
    commands: 
      - <wait5s>
      - defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
      - <enter>
      - <wait1s>
      - defaults write  com.apple.VoiceOverTraining doNotShowSplashScreen -int 1
      - <enter>

  - title: Quit Terminal
    commands: 
      - <wait1s>
      - <leftAltOn>
      - q
      - <leftAltOff>

  - title: Open System Settings
    commands: 
      - <wait1s>
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - System Settings
      - <wait1s>
      - <enter>

  - title: Navigate to Sharing
    commands: 
      - <locate text='Software Update'>
      - <leftCtrlOn>
      - <fnOn>
      - <f2>
      - <fnOff>
      - <leftCtrlOff>
      - <right repeat=3>
      - <down>
      - Sharing
      - <enter>

  - title: Navigate to "Screen Sharing" and enable it
    commands: 
      - <locate text='Screen Sharing'>
      - <tab repeat=7>
      - <spacebar>

  - title: Navigate to "Remote Login" and enable it
    commands: 
      - <tab repeat=12>
      - <spacebar>

  - title: Quit System Settings
    commands: 
      - <leftAltOn>
      - q
      - <leftAltOff>

  - title: Open Terminal to Disable Gatekeeper
    commands: 
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - Terminal
      - <enter>

  - title: Disable Gatekeeper
    commands: 
      - <wait5s>
      - sudo spctl --global-disable
      - <enter>
      - <wait2s>
      - ${var.password}
      - <enter>
      - <wait2s>
      - <leftAltOn>
      - q
      - <leftAltOff>

  - title: Open System Settings for Disable Gatekeeper
    commands: 
      - <wait1s>
      - <leftAltOn>
      - <spacebar>
      - <leftAltOff>
      - System Settings
      - <wait1s>
      - <enter>

  - title: Navigate to "Privacy & Security"
    commands: 
      - <locate text='Software Update'>
      - <leftCtrlOn>
      - <fnOn>
      - <f2>
      - <fnOff>
      - <leftCtrlOff>
      - <right repeat=3>
      - <down>
      - "Privacy & Security"
      - <enter>

  - title: Navigate to "Allow apps downloaded from" and enable "Everywhere"
    commands: 
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <down>
      - <wait1s>
      - <down>
      - <wait1s>
      - <enter>

  - title: Enter password to disable Gatekeeper
    commands: 
      - <wait1s>
      - ${var.password}
      - <enter>

  - title: Confirm Gatekeeper disable
    commands: 
      - <wait5s>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <wait1s>
      - <spacebar>

  - title: Quit System Settings
    commands: 
      - <wait5s>
      - <leftAltOn>
      - q
      - <leftAltOff>
