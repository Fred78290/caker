# vanilla-sequoia.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required (see vanilla-sequoia.pkr.hcl
# for the equivalent Packer-based recipe this was transcribed from).
#
# Usage:
#   cakectl build my-vm https://.../UniversalMac_26.6_25G72_Restore.ipsw \
#     --user admin --password admin \
#     --template templates/macos/vanilla-sequoia.packerlite.yaml
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# How long to wait after the VM starts before sending the first keystroke.
create_grace_time: 30s
# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m

boot_command:
  # Language: most of the time we have a list of "English"[1], "English (UK)", etc. with
  # "English" already selected. If we type "english", it'll switch to "English (UK)",
  # which is not what we want. To solve this, we switch to some other language first,
  # e.g. "Italiano" and then switch back to "English": we'll jump to the first entry
  # in a list of "english"-prefixed items, which will be "English".
  # [1]: should be named "English (US)", but oh well
  - "<wait10s>italiano<esc>english<enter>"
  # Select Your Country or Region
  - "<wait30s><click 'Select Your Country or Region'><wait5s>united states<leftShiftOn><tab><leftShiftOff><spacebar>"
  # Transfer Your Data to This Mac
  - "<wait10s><tab><tab><tab><spacebar><tab><tab><spacebar>"
  # Written and Spoken Languages
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Accessibility
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Data & Privacy
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Create a Mac Account
  - "<wait10s>Managed via Caker<tab>${var.username}<tab>${var.password}<tab>${var.password}<tab><tab><spacebar><tab><tab><spacebar>"
  # Enable Voice Over
  - "<wait120s><leftAltOn><f5><leftAltOff>"
  # Sign In with Your Apple ID
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Are you sure you want to skip signing in with an Apple ID?
  - "<wait10s><tab><spacebar>"
  # Terms and Conditions
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # I have read and agree to the macOS Software License Agreement
  - "<wait10s><tab><spacebar>"
  # Enable Location Services
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Are you sure you don't want to use Location Services?
  - "<wait10s><tab><spacebar>"
  # Select Your Time Zone
  - "<wait10s><tab><tab>UTC<enter><leftShiftOn><tab><tab><leftShiftOff><spacebar>"
  # Analytics
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Screen Time
  - "<wait10s><tab><spacebar>"
  # Siri
  - "<wait10s><tab><spacebar><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Choose Your Look
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Update Mac Automatically
  - "<wait10s><tab><spacebar>"
  # Welcome to Mac
  - "<wait10s><spacebar>"
  # Disable Voice Over
  - "<leftAltOn><f5><leftAltOff>"
  # Enable Keyboard navigation so we can navigate System Settings using the keyboard
  - "<wait10s><leftAltOn><spacebar><leftAltOff>Terminal<enter>"
  - "<wait10s>defaults write NSGlobalDomain AppleKeyboardUIMode -int 3<enter>"
  - "<wait10s><leftAltOn>q<leftAltOff>"
  # Now that the installation is done, open "System Settings"
  - "<wait10s><leftAltOn><spacebar><leftAltOff>System Settings<enter>"
  # Navigate to "Sharing"
  - "<wait10s><leftCtrlOn><f2><leftCtrlOff><right><right><right><down>Sharing<enter>"
  # Navigate to "Screen Sharing" and enable it
  - "<wait10s><tab><tab><tab><tab><tab><tab><tab><spacebar>"
  # Navigate to "Remote Login" and enable it
  - "<wait10s><tab><tab><tab><tab><tab><tab><tab><tab><tab><tab><tab><tab><spacebar>"
  # Quit System Settings
  - "<wait10s><leftAltOn>q<leftAltOff>"
  # Disable Gatekeeper (1/2)
  - "<wait10s><leftAltOn><spacebar><leftAltOff>Terminal<enter>"
  - "<wait10s>sudo spctl --global-disable<enter>"
  - "<wait10s>${var.password}<enter>"
  - "<wait10s><leftAltOn>q<leftAltOff>"
  # Disable Gatekeeper (2/2)
  - "<wait10s><leftAltOn><spacebar><leftAltOff>System Settings<enter>"
  - "<wait10s><leftCtrlOn><f2><leftCtrlOff><right><right><right><down>Privacy & Security<enter>"
  - "<wait10s><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff>"
  - "<wait10s><down><wait1s><down><wait1s><enter>"
  - "<wait10s>${var.password}<enter>"
  - "<wait10s><leftShiftOn><tab><leftShiftOff><wait1s><spacebar>"
  # Quit System Settings
  - "<wait10s><leftAltOn>q<leftAltOff>"
