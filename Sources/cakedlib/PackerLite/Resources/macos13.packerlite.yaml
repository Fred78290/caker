# vanilla-macos13.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required.
#
# Usage:
#   cakectl build my-vm https://updates.cdn-apple.com/2023FallFCS/fullrestores/042-55833/C0830847-A2F8-458F-B680-967991820931/UniversalMac_13.6_22G120_Restore.ipsw \
#     --user admin --password admin \
#     --macos-version macos13
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m
required_variables:
  - username
  - password
  - hostname

boot_command:
  - title: Wait hello, hola, bonjour, etc.
    commands: 
      - <wait10s>
      - <spacebar>

  - title: Select Language
    commands: 
      - <locate timeout=30 text='https://www.apple.com/'>
      - italiano
      - <esc>
      - english
      - <down>
      - <enter>

  - title: Select Your Country and Region
    commands: 
      - <click timeout=30 text='Select Your Country or Region'>
      - <wait5s>
      - united states
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Written and Spoken Languages
    commands: 
      - <locate text='Written and Spoken Languages'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Change keyboard
    commands: 
      - <skipCommandIfNotFound timeout=10 text='Changekeyboard'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Select keyboard layout
    commands: 
      - <keyboard 'com.apple.keylayout.US'>

  - title: Accessibility
    commands: 
      - <locate text='Accessibility'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Data & Privacy
    commands: 
      - <locate text='Data & Privacy'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Migration Assistant
    commands: 
      - <locate text='Migration Assistant'>
      - <tab repeat=3>
      - <spacebar>

  - title: Sign In with Your Apple ID
    commands: 
      - <locate timeout=60 text='Sign In with Your Apple ID'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you want to skip signing in with an Apple ID?
    commands: 
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Terms and Conditions
    commands: 
      - <locate timeout=30 text='Terms and Conditions'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: I have read and agree to the macOS Software License Agreement
    commands: 
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Create a Computer Account
    commands: 
      - <locate text='Create a Computer Account'>
      - ${var.username}
      - <tab>
      - <tab>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <tab>
      - <tab>
      - <spacebar>

  - title: Enable Location Services
    commands: 
      - <locate timeout=30 text='Enable Location Services'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Are you sure you don't want to use Location Services?
    commands: 
      - <wait2s>
      - <tab>
      - <spacebar>

  - title: Select Your Time Zone
    commands: 
      - <locate timeout=30 text='Select Your Time Zone'>
      - <tab>
      - UTC
      - <enter>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Analytics
    commands: 
      - <locate timeout=30 text='Analytics'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Screen Time
    commands: 
      - <locate timeout=30 text='Screen Time'>
      - <tab>
      - <spacebar>

  - title: Siri
    commands: 
      - <skipCommandIfNotFound timeout=10 text='Siri'>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Choose Your Look
    commands: 
      - <locate timeout=30 text='Choose Your Look'>
      - <leftShiftOn>
      - <tab>
      - <leftShiftOff>
      - <spacebar>

  - title: Enable Voice Over
    commands:
      - <wait10s>
      - <voiceOverOn confirm=true>

  - title: Now that the installation is done, open "Applications folder"
    commands:
      - <wait2s>
      - <leftAltOn>
      - <leftShiftOn>
      - a
      - <leftShiftOff>
      - <leftAltOff>
      - <wait1s>
      - System Preferences
      - <wait1s>
      - <leftAltOn>
      - o
      - <leftAltOff>

  - title: Navigate to "Sharing"
    commands: 
      - <locate text='Appearance'>
      - General
      - <wait1s>
      - <tab repeat=8>
      - <wait1s>
      - <spacebar>

  - title: Navigate to "Screen Sharing" and enable it
    commands: 
      - <locate text='Screen Sharing'>
      - <tab repeat=2>
      - <spacebar>
      - <wait1s>

  - title: Navigate to "Remote Login" and enable it
    commands: 
      - <tab repeat=6>
      - <spacebar>
      - <wait1s>

  - title: Enable "Full Disk Access"
    commands: 
      - <tab>
      - <spacebar>

  - title: Click "Done"
    commands: 
      - <locate text='Administrators'>
      - <tab>
      - <spacebar>
      - <leftShiftOn>
      - <tab repeat=2>
      - <leftShiftOff>
      - <spacebar>
      - <wait1s>

  - title: Quit System Settings
    commands: 
      - <leftAltOn>
      - q
      - <leftAltOff>

  - title: Disable Voice Over
    commands: 
      - <voiceOverOff>

post_boot_command:
  use_ssh_key: false
  commands:
    - sh -c 'echo "${var.ssh_authorized_key}" > ~/.ssh/authorized_keys'
    - "echo ${var.password} | sudo -S sh -c 'echo \"${var.username} ALL=(ALL:ALL) NOPASSWD: ALL\" > /etc/sudoers.d/${var.username}'"
