# fedora-server.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of Fedora Server
# from the official install ISO, driven natively by caked/caker after booting
# from the ISO (see the "PackerLite" section of the wiki's command summary).
# This is the default template auto-selected for a Fedora ISO whose
# filename/URL does NOT look like a desktop/workstation build (see
# CakeConfig.osDesktop / VMBuilder's detection) when --autoinstall is passed
# without an explicit --template — pass --template yourself to override it.
# Unlike the bundled macOS templates, this one is NOT a guaranteed-working
# recipe: it has been reviewed for plausibility against the documented
# Anaconda install flow, but NOT validated end-to-end against a real boot.
# Treat the click targets and tab counts below as a first draft to
# verify/adjust against your own run.
#
# Unlike Fedora Workstation's Live ISO (fedora.packerlite.yaml), Fedora
# Server's install ISO boots straight into the graphical Anaconda installer —
# there's no live desktop session and no `liveinst` step needed first, the
# same shape as centos.packerlite.yaml/redhat.packerlite.yaml
# (Fedora, CentOS Stream, and RHEL all share the Anaconda installer).
#
# The boot ISO's default software selection is a minimal server install with
# no desktop environment. If you want a desktop, open the "Software
# Selection" hub spoke and pick a desktop environment — this template leaves
# that spoke untouched and takes whatever the ISO's default selection is.
#
# Usage:
#   cakectl build my-fedora-vm ./Fedora-Server-dvd-x86_64-44-1.7.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

boot_timeout: 60m # a full install can legitimately take 20-30+ minutes
required_variables:
  - username
  - password
  - hostname

pre_boot_command:
  - title: Boot the GRUB menu's default "Install" entry
    commands:
      - <locate text="GRUB" timeout=30>
      - <enter>

  - title: Wait Anaconda to start
    commands:
      - <locate text="when reporting a bug" timeout=180>
      - <wait10s>

boot_command:
  - title: Change keyboard
    commands:
      - <keyboard 'com.apple.keylayout.US'>

  - title: Choose langue
    commands:
      - <locate text="SERVER">
      - english
      - <enter>
      - <wait1s>
      - <tab repeat=6>
      - <enter>
      - <wait2s>

  - title: Create user account
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="User Creation">
      - <wait1s>

  - title: Fill user account information
    commands:
      - <locate text="CREATE USER">
      - <wait1s>
      - ${var.username}
      - <tab>
      - ${var.username}
      - <tab repeat=3>
      - ${var.password}
      - <tab>
      - ${var.password}
      - <tab>
      - <click text="Done">
      - <wait1s>

  - title: Confirm password
    commands:
      - <skipCommandIfNotFound text="Press done again to use the password anyway">
      - <click text="Done">
      - <wait1s>

  - title: Configure hostname and network
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="Connected">
      - <locate text="Hardware Address">
      - <tab repeat=5>
      - ${var.hostname}
      - <tab>
      - <spacebar>
      - <wait1s>
      - <click text="Done">
      - <wait1s>

  - title: Installation Destination
    commands:
      - <locate text="INSTALLATION SUMMARY">
      - <wait1s>
      - <click text="Installation Destination">
      - <locate text="Device Selection">
      - <wait1s>
      - <click text="Done">
      - <wait1s>

  - title: Begin Installation
    commands:
      - <click text="Begin Installation">

  - title: Wait installed and ready for you to use!
    commands:
      - <locate text="is now successfully installed and ready for you to use|reboot your system|Go ahead" timeout=1200>

  - title: Reboot System
    commands:
      - <click text="Reboot System">

post_boot_command:
  use_ssh_key: false
  commands:
    - mkdir -p /home/${var.username}/.ssh
    - |
      cat >> /home/${var.username}/.ssh/authorized_keys <<EOF
      ${var.ssh_authorized_key}
      EOF
    - "echo ${var.password} | sudo -S sh -c 'echo \"${var.username} ALL=(ALL:ALL) NOPASSWD: ALL\" > /etc/sudoers.d/${var.username}'"
    - sudo semanage fcontext -a -t bin_t '/usr/local/bin/cakeagent'
    - sudo restorecon -Rv /usr/local/bin/cakeagent /etc/cakeagent /etc/sysconfig/cakeagent /var/log/cakeagent.out /var/log/cakeagent.err /etc/cakeagent/ssl/ca.pem /etc/cakeagent/ssl/server.pem /etc/cakeagent/ssl/server.key
    - sudo ausearch -c '(cakeagent)' --raw | audit2allow -M my-cakeagent
    - sudo semodule -i my-cakeagent.pp || true
    - sudo restorecon -Rv /usr/local/bin/cakeagent /etc/cakeagent /etc/sysconfig/cakeagent /var/log/cakeagent.out /var/log/cakeagent.err /etc/cakeagent/ssl/ca.pem /etc/cakeagent/ssl/server.pem /etc/cakeagent/ssl/server.key
    - sudo dnf upgrade -y --refresh
    - sudo dnf install -y cloud-init cloud-utils-growpart
    - "sudo sh -c 'echo \"datasource_list: [ NoCloud, None ]\" > /etc/cloud/cloud.cfg.d/100_datasources.cfg'"
    - |
      sudo sh -c 'mkdir -p /etc/systemd/resolved.conf.d && cat > /etc/systemd/resolved.conf.d/10-compose-dns.conf' <<'EOF'
      [Resolve]
      DNS=${var.dnsIP}:${var.dnsPort}
      Domains=${var.domain}
      EOF
    - sudo systemctl enable systemd-resolved || true
    - sudo systemctl restart systemd-resolved || true
    - |
      sudo sh <<'EOS'
      D="${var.domain}"
      G="${var.dnsIP}"
      # vmnet's DHCP server announces the domain "guest": keep it out of the search list so the
      # default domain is the compose one, whichever network stack the guest uses.
      mkdir -p /etc/systemd/networkd.conf.d
      cat > /etc/systemd/networkd.conf.d/10-compose-dns.conf <<'EOF'
      [DHCPv4]
      UseDomains=no
      [DHCPv6]
      UseDomains=no
      EOF
      if [ -f /etc/dhcp/dhclient.conf ] && ! grep -q 'compose-dns' /etc/dhcp/dhclient.conf; then
        printf '# compose-dns\nsupersede domain-name "%s";\nsupersede domain-search "%s";\n' "$D" "$D" >> /etc/dhcp/dhclient.conf
      fi
      if command -v nmcli >/dev/null 2>&1 && systemctl is-active NetworkManager >/dev/null 2>&1; then
        IFACE=$(ip route get "$G" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')
        CON=$(nmcli -g GENERAL.CONNECTION device show "$IFACE" 2>/dev/null)
        if [ -n "$CON" ]; then
          nmcli connection modify "$CON" ipv4.ignore-auto-dns yes ipv4.dns "$G" ipv4.dns-search "$D" ipv6.ignore-auto-dns yes ipv6.dns-search "$D" || true
          nmcli device reapply "$IFACE" || true
        fi
      fi
      if systemctl is-active systemd-networkd >/dev/null 2>&1; then
        systemctl restart systemd-networkd || true
      fi
      EOS

