# linux-fedora.packerlite.yaml
#
# Built-in PackerLite template — unattended installation of Fedora Workstation
# from the official Live ISO, driven natively by caked/caker after booting from
# the ISO (see the "PackerLite" section of the wiki's command summary). This is
# the default template auto-selected for a Fedora ISO whose filename/URL looks
# like a desktop/workstation build (see CakeConfig.osDesktop / VMBuilder's
# detection) when --autoinstall is passed without an explicit --template —
# pass --template yourself to override it. For a Fedora Server ISO, see the
# sibling linux-fedora-server.packerlite.yaml instead.
# Unlike the bundled macOS templates, this one is NOT a guaranteed-working
# recipe: it has been reviewed for plausibility against Fedora's documented
# live-install flow, but NOT validated end-to-end against a real boot. Treat
# the click targets and tab counts below as a first draft to verify/adjust
# against your own run.
#
# Targets the CLASSIC GTK Anaconda installer used by Fedora Workstation Live
# media through roughly Fedora 40. Fedora 41+ switched the default Workstation
# live installer to the new Anaconda WebUI (a browser-based interface embedded
# in a kiosk browser), which has a very different navigation flow — this
# template will need rework to drive that instead.
#
# Usage:
#   cakectl build my-fedora-vm ./Fedora-Workstation-Live-x86_64-40-1.14.iso \
#     --user admin --password admin --autoinstall
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.
#
# Assumptions worth checking against your own run:
#   - The live session's default "liveuser" has passwordless sudo (true on
#     stock Fedora media) — used to launch the installer and to reboot without
#     a password prompt appearing mid-sequence.
#   - GNOME Shell's Activities overview opens on a single press of the
#     Super/Cmd key and auto-focuses its search box, matching the Spotlight
#     idiom the bundled macOS templates use to open Terminal.
#   - After Anaconda finishes, grub2-install/efibootmgr register the freshly
#     installed system as the default EFI boot entry, so the *next* VM boot
#     (after this template hands back to caked, which shuts the VM down) goes
#     into the installed system rather than back into the live media, even
#     though the install ISO stays attached to the VM's configuration. This
#     template deliberately does not reboot mid-run or attempt cakeagent
#     installation itself — the live session's root filesystem is an ephemeral
#     overlay, so anything installed into it before the switch to the real
#     disk would be lost anyway.

boot_timeout: 60m        # a full desktop install can legitimately take 20-30+ minutes

pre_boot_command:
- title: Boot the GRUB menu's default "Install" entry
  commands:
  - <locate text="GRUB" timeout=30>
  - <enter>

boot_command:
- title: Wait Anaconda
  commands:
  - <locate text="SERVER" timeout=120>
  - <wait2s>

- title: Choose langue
  commands:
  - english
  - <tab repeat=6>
  - <enter>

- title: Change keyboard
  commands:
  - <keyboard 'com.apple.keylayout.US'>

- title: Create user account
  commands:
  - <locate text="INSTALLATION SUMMARY">
  - <wait1s>
  - <click text="User Creation">

- title: Fill user account information
  commands:
  - <locate text="CREATE USER">
  - ${var.username}
  - <tab>
  - ${var.username}
  - <tab repeat=3>
  - ${var.password}
  - <tab>
  - ${var.password}
  - <tab>
  - <click text="Done">

- title: Confirm password
  commands:
  - <skipCommandIfNotFound text="Press done again to use the password anyway">
  - <click text="Done">

- title: Installation Destination
  commands:
  - <locate text="INSTALLATION SUMMARY">
  - <wait1s>
  - <click text="Installation Destination">
  - <locate text="Device Selection">
  - <wait1s>
  - <click text="Done">
  - <wait1s>

- title: Begin Installation
  commands:
  - <click text="Begin Installation">

- title: Wait installed and ready for you to use!
  commands:
  - <locate text="Fedora is now successfully installed and ready for you to use!" timeout=1200>

- title: Reboot System
  commands:
  - <click text="Reboot System">
