# vanilla-sonoma.packerlite.yaml
#
# Built-in PackerLite template — unattended macOS Setup Assistant provisioning,
# driven natively by caked/caker after installing from an IPSW. No external
# `packer` binary or packer-plugin-tart required.
#
# Usage:
#   cakectl build my-vm https://.../UniversalMac_14.6.1_23G93_Restore.ipsw \
#     --user admin --password admin \
#     --macos-version sonoma
#
# ${var.username}/${var.password} below resolve to the VM's actual account,
# i.e. whatever --user/--password (or the UI) configured — not declared here.

# How long to wait after the VM starts before sending the first keystroke.
create_grace_time: 30s
# Overall watchdog — provisioning fails fast instead of hanging if the UI drifts.
boot_timeout: 45m

boot_command:
  # Language: most of the times we have a list of "English"[1], "English (UK)", etc. with
  # "English" language already selected. If we type "english", it'll cause us to switch
  # to the "English (UK)", which is not what we want. To solve this, we switch to some other
  # language first, e.g. "Italiano" and then switch back to "English". We'll then jump to the
  # first entry in a list of "english"-prefixed items, which will be "English".
  #
  # [1]: should be named "English (US)", but oh well 🤷
  - "<wait10s>italiano<esc>english<enter>"
  # Select Your Country and Region
  - "<wait30s>united states<leftShiftOn><tab><leftShiftOff><spacebar>"
  # Written and Spoken Languages
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Change keyboard
  - "<keyboard 'com.apple.keylayout.US'>"
  # Accessibility
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Data & Privacy
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Migration Assistant
  - "<wait10s><tab><tab><tab><spacebar>"
  # Sign In with Your Apple ID
  - "<wait10s><leftShiftOn><tab><leftShiftOff><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Are you sure you want to skip signing in with an Apple ID?
  - "<wait10s><tab><spacebar>"
  # Terms and Conditions
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # I have read and agree to the macOS Software License Agreement
  - "<wait10s><tab><spacebar>"
  # Create a Computer Account
  - "<wait10s>${var.username}<tab><tab>${var.password}<tab>${var.password}<tab><tab><tab><spacebar>"
  # Enable Location Services
  - "<wait30s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Are you sure you don't want to use Location Services?
  - "<wait10s><tab><spacebar>"
  # Select Your Time Zone
  - "<wait10s><tab>UTC<enter><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Analytics
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Screen Time
  - "<wait10s><tab><spacebar>"
  # Siri
  - "<wait10s><tab><spacebar><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Choose Your Look
  - "<wait10s><leftShiftOn><tab><leftShiftOff><spacebar>"
  # Enable Voice Over
  - "<wait10s><leftAltOn><f5><leftAltOff><wait5s>v"
  # Now that the installation is done, open "System Settings"
  - "<wait10s><leftAltOn><spacebar><leftAltOff>System Settings<enter>"
  # Navigate to "Sharing"
  - "<wait10s><leftAltOn>f<leftAltOff>sharing<enter>"
  # Navigate to "Screen Sharing" and enable it
  - "<wait10s><tab><tab><tab><tab><tab><spacebar>"
  # Navigate to "Remote Login" and enable it
  - "<wait10s><tab><tab><tab><tab><tab><tab><tab><tab><tab><tab><tab><tab><spacebar>"
  # Disable Voice Over
  - "<leftAltOn><f5><leftAltOff>"
