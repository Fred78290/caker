# library-id: vaultwarden-caddy
# library-name: Vaultwarden + Caddy
# library-category: Security
# library-summary: A Vaultwarden password manager (Bitwarden-compatible) on one VM and a Caddy reverse proxy with a local HTTPS certificate on another; HTTPS is forwarded on 8443.
# library-tags: vaultwarden, bitwarden, caddy, https, reverse-proxy, passwords
name: vault
services:
  # Vaultwarden has no distribution package: it runs as its official container image.
  vaultwarden:
    image: ubuntu:26.04
    user: ubuntu
    password: ubuntu
    disk: 20          # GiB
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1024M
    package_update: true
    packages:
      - docker.io
    post_commands:
      - systemctl enable --now docker
      - mkdir -p /srv/vaultwarden
      # Only Caddy talks to it, over the compose network; the web vault needs HTTPS, which Caddy provides.
      # The image tag is pinned (not :latest) so the stack stays reproducible: bump it on purpose.
      - docker run -d --name vaultwarden --restart always -p 80:80 -v /srv/vaultwarden:/data -e DOMAIN=https://localhost:8443 vaultwarden/server:1.37.5

  # Caddy terminates HTTPS with its own local CA ("tls internal") and proxies to the vaultwarden VM
  # by its compose DNS name. The browser warns about the certificate until you trust Caddy's root:
  # copy /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt out of this VM.
  caddy:
    image: ubuntu:26.04
    user: ubuntu
    password: ubuntu
    disk: 10          # GiB
    ports:
      - 8443:8443     # https://localhost:8443
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
    depends_on:
      - vaultwarden
    package_update: true
    packages:
      - caddy
    write_files:
      # Written next to the packaged Caddyfile and copied over it afterwards, so the package install doesn't ask about a modified config file.
      - path: /etc/caddy/Caddyfile.vault
        content: |
          localhost:8443 {
          	# Listen on every interface, not only loopback, so the forwarded port always reaches it.
          	bind 0.0.0.0
          	tls internal
          	reverse_proxy vaultwarden.vault.compose.internal:80
          }
        permissions: '0644'
    post_commands:
      - cp /etc/caddy/Caddyfile.vault /etc/caddy/Caddyfile
      - systemctl restart caddy
