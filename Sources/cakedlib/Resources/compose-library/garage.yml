# library-id: garage
# library-name: Garage S3 storage
# library-category: Storage
# library-summary: A single-node Garage object store with an S3-compatible API, a bucket and an access key created at first boot; the S3 API is forwarded on 3900 and the admin API on 3903.
# library-tags: garage, s3, object-storage, self-hosted
name: garage
services:
  garage:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 30          # GiB
    ports:
      - 3900:3900     # S3 API
      - 3903:3903     # admin API
    environment:
      GARAGE_BUCKET: myapp-data
      GARAGE_KEY_NAME: myapp-key
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
    package_update: true
    packages:
      - curl
      - openssl
    write_files:
      - path: /etc/systemd/system/garage.service
        content: |
          [Unit]
          Description=Garage object store
          After=network-online.target
          Wants=network-online.target

          [Service]
          Environment=RUST_LOG=garage=info
          ExecStart=/usr/local/bin/garage server
          Restart=always

          [Install]
          WantedBy=multi-user.target
        permissions: '0644'
      - path: /etc/motd.d/garage.motd
        content: |
          Garage S3 API: http://localhost:3900 (region "garage", path-style requests).
          The access key and secret of the first boot are in /root/garage-key.txt (sudo cat it);
          the bucket is GARAGE_BUCKET from the compose file. Try it with the AWS CLI:
          AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... aws --endpoint-url http://localhost:3900 --region garage s3 ls
        permissions: '0644'
    post_commands:
      # Not in the Ubuntu archive: the official static binary (version pinned here), whose architecture names differ from dpkg's.
      # Garage publishes no checksums, so the SHA-256 pinned here are those of the v1.0.1 files as downloaded when this template
      # was written; the install is refused when the download differs. Update both when bumping the version.
      - |
        set -e
        case "$(dpkg --print-architecture)" in
          arm64) target=aarch64; sha=768e3adb246e408c7bd8b9c092f2e3563c28c6c9c63acfb4c7b638eae25bea7a ;;
          *) target=x86_64; sha=3444d69063a91a1b4fb771a47f056db53c44f51d51e4eb58fb357fe62fe26f26 ;;
        esac
        curl -fsSL -o /tmp/garage.download "https://garagehq.deuxfleurs.fr/_releases/v1.0.1/$target-unknown-linux-musl/garage"
        echo "$sha  /tmp/garage.download" | sha256sum -c -
        install -m 755 /tmp/garage.download /usr/local/bin/garage
        rm -f /tmp/garage.download
      - |
        mkdir -p /var/lib/garage/meta /var/lib/garage/data
        cat > /etc/garage.toml <<TOML
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "sqlite"
        replication_factor = 1
        rpc_bind_addr = "127.0.0.1:3901"
        rpc_secret = "$(openssl rand -hex 32)"

        [s3_api]
        s3_region = "garage"
        api_bind_addr = "0.0.0.0:3900"

        [admin]
        api_bind_addr = "0.0.0.0:3903"
        admin_token = "$(openssl rand -base64 32)"
        TOML
        chmod 600 /etc/garage.toml
      - systemctl daemon-reload
      - systemctl enable --now garage
      # A single node needs a layout before it accepts data, then the bucket and a key allowed on it.
      - |
        set -e
        . /etc/environment
        ready=
        for i in $(seq 1 30); do
          if garage status >/dev/null 2>&1; then ready=1; break; fi
          sleep 2
        done
        [ -n "$ready" ] || { echo "garage did not become ready" >&2; exit 1; }
        node=$(garage node id -q | cut -d@ -f1)
        garage layout assign -z dc1 -c 10G "$node"
        garage layout apply --version 1
        garage bucket create "$GARAGE_BUCKET"
        # Written aside and renamed, so a failed key creation never leaves an empty credential file behind.
        (umask 077; garage key create "$GARAGE_KEY_NAME" > /root/garage-key.txt.new)
        mv /root/garage-key.txt.new /root/garage-key.txt
        garage bucket allow --read --write --owner "$GARAGE_BUCKET" --key "$GARAGE_KEY_NAME"
