# library-id: alpine-dev
# library-name: Alpine dev box
# library-category: Development
# library-summary: A single Alpine Linux 3.24 VM with the usual build tools, Git and Python ready to use; ports 3000 and 8000 are forwarded to the host for dev servers.
# library-tags: alpine, musl, toolchain, git, python, sandbox
name: alpine-devbox
services:
  dev:
    # linuxcontainers.org's Alpine cloud image (cloud-init enabled), for the architecture of this Mac.
    image: alias:alpine324
    user: alpine
    password: alpine
    disk: 20          # GiB
    nested: true
    ports:
      - 3000:3000
      - 8000:8000
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4096M
    package_update: true
    package_upgrade: true
    packages:
      - sudo
      - bash
      - build-base
      - git
      - curl
      - wget
      - vim
      - tmux
      - jq
      - unzip
      - python3
      - py3-pip
    write_files:
      # Alpine reads /etc/motd, not a motd.d directory.
      - path: /etc/motd
        content: |
          Alpine dev box ready: build-base (gcc, make, musl), git, curl, jq, tmux, python3 (pip).
          Dev servers listening on 3000 or 8000 are reachable on the host's localhost.
          Log in with `cakectl sh compose-alpine-devbox-dev` or ssh alpine@<ip>.
          Packages come from apk (apk add <name>); the C library is musl, not glibc.
        permissions: '0644'
