# library-id: lemp
# library-name: LEMP stack
# library-category: Web
# library-summary: Nginx with PHP-FPM on one VM and MariaDB on another, wired together through compose DNS.
# library-tags: lemp, nginx, php, mariadb, web
name: lemp
services:
  db:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 20          # GiB
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: change-me
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
    package_update: true
    packages:
      - mariadb-server
    post_commands:
      - sed -i "s/^bind-address.*/bind-address = 0.0.0.0/" /etc/mysql/mariadb.conf.d/50-server.cnf
      - systemctl restart mariadb
      - |
        . /etc/environment
        mysql -u root -e "CREATE DATABASE IF NOT EXISTS $MYSQL_DATABASE; CREATE USER IF NOT EXISTS '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD'; GRANT ALL PRIVILEGES ON $MYSQL_DATABASE.* TO '$MYSQL_USER'@'%'; FLUSH PRIVILEGES;"

  web:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 10          # GiB
    ports:
      - "8080:80"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
    package_update: true
    packages:
      - nginx
      - php-fpm
      - php-mysql
    write_files:
      # Staged outside /etc/nginx so the package's own default site can't clash with it; copied in below.
      - path: /root/lemp-site.conf
        content: |
          server {
              listen 80 default_server;
              root /var/www/html;
              index index.php index.html;
              location / { try_files $uri $uri/ =404; }
              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
              }
          }
        permissions: "0644"
      # `db.lemp.compose.internal` is the db service's compose DNS name (<service>.<project>.<domain>).
      - path: /var/www/html/index.php
        content: |
          <?php
          mysqli_report(MYSQLI_REPORT_OFF);
          try {
              $db = new mysqli('db.lemp.compose.internal', 'app', 'change-me', 'app');
              echo $db->connect_errno ? 'Database: ' . htmlspecialchars($db->connect_error) : 'Database: connected, MariaDB ' . $db->server_info;
          } catch (Throwable $e) {
              echo 'Database: ' . htmlspecialchars($e->getMessage());
          }
          echo '<hr>';
          phpinfo();
        permissions: "0644"
    post_commands:
      - cp /root/lemp-site.conf /etc/nginx/sites-available/default
      - nginx -t && systemctl restart nginx
