# library-id: nextcloud
# library-name: Nextcloud
# library-category: Storage
# library-summary: A Nextcloud file-sync and collaboration server from the official snap, with an administrator account; the web UI is forwarded on 8080.
# library-tags: nextcloud, files, sync, collaboration, self-hosted
name: nextcloud
services:
  nextcloud:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 40          # GiB
    ports:
      - 8080:80       # web UI
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: change-me-please
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
    package_update: true
    write_files:
      - path: /etc/motd.d/nextcloud.motd
        content: |
          Nextcloud: open http://localhost:8080 on the host (forwarded).
          Log in with NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD from the compose file.
          Administration: sudo nextcloud.occ ...
        permissions: '0644'
    post_commands:
      # Nextcloud isn't in the Ubuntu archive; the official snap bundles its own web server and database.
      - snap wait system seed.loaded
      - snap install nextcloud
      - |
        # /etc/environment holds the raw values: read them with grep rather than sourcing the file, which would
        # split a password with a space and expand a `$` in it.
        admin_user=$(grep '^NEXTCLOUD_ADMIN_USER=' /etc/environment | cut -d= -f2-)
        admin_password=$(grep '^NEXTCLOUD_ADMIN_PASSWORD=' /etc/environment | cut -d= -f2-)
        nextcloud.manual-install "$admin_user" "$admin_password"
      # The host reaches it as localhost:8080 (forwarded port) or through the VM's address.
      - nextcloud.occ config:system:set trusted_domains 1 --value=localhost
      - nextcloud.occ config:system:set trusted_domains 2 --value=localhost:8080
      - nextcloud.occ config:system:set trusted_domains 3 --value="$(hostname -I | awk '{print $1}')"
