# library-id: docker-host
# library-name: Docker host
# library-category: Containers
# library-summary: An Ubuntu VM running the Docker engine and the compose plugin, with the default user in the docker group.
# library-tags: docker, containers, compose, oci
name: dockerhost
services:
  docker:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 40          # GiB
    nested: true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4096M
    package_update: true
    packages:
      - docker.io
      - docker-compose-v2
    post_commands:
      - systemctl enable --now docker
      - usermod -aG docker ubuntu
