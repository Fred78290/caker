# library-id: k3s
# library-name: k3s Kubernetes (single node)
# library-category: Containers
# library-summary: A single-node k3s cluster; the Kubernetes API is forwarded to the host on port 6443, and the ingress (Traefik) on 8080 and 8443.
# library-tags: kubernetes, k3s, k8s, containers
name: k3s
services:
  server:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 30          # GiB
    ports:
      - "6443:6443"
      - "8080:80"
      - "8443:443"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4096M
    package_update: true
    packages:
      - curl
    write_files:
      - path: /etc/motd.d/k3s.motd
        content: |
          k3s is running. The kubeconfig is /etc/rancher/k3s/k3s.yaml: copy it to the host and
          point its `server:` at this VM's address (or at localhost, port 6443 is forwarded).
          The ingress controller answers on this VM's ports 80 and 443, forwarded to the host's 8080 and 8443.
        permissions: "0644"
    post_commands:
      # The installer script is downloaded from get.k3s.io: read it before running this on anything that matters.
      - curl -sfL https://get.k3s.io | K3S_KUBECONFIG_MODE=644 sh -
