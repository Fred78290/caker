# library-id: lamp
# library-name: LAMP stack
# library-category: Web
# library-summary: Apache with PHP on one VM and MariaDB on another, wired together through compose DNS.
# library-tags: lamp, apache, php, mariadb, web
name: lamp
services:
  db:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 20          # GiB
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: change-me
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
    package_update: true
    packages:
      - mariadb-server
    post_commands:
      - sed -i "s/^bind-address.*/bind-address = 0.0.0.0/" /etc/mysql/mariadb.conf.d/50-server.cnf
      - systemctl restart mariadb
      - |
        . /etc/environment
        mysql -u root -e "CREATE DATABASE IF NOT EXISTS $MYSQL_DATABASE; CREATE USER IF NOT EXISTS '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD'; GRANT ALL PRIVILEGES ON $MYSQL_DATABASE.* TO '$MYSQL_USER'@'%'; FLUSH PRIVILEGES;"

  web:
    image: ubuntu:24.04
    user: ubuntu
    password: ubuntu
    disk: 10          # GiB
    ports:
      - "8080:80"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
    package_update: true
    packages:
      - apache2
      - libapache2-mod-php
      - php-mysql
    write_files:
      # `db.lamp.compose.internal` is the db service's compose DNS name (<service>.<project>.<domain>).
      - path: /var/www/html/index.php
        content: |
          <?php
          $db = @new mysqli('db.lamp.compose.internal', 'app', 'change-me', 'app');
          echo $db->connect_errno ? 'Database: ' . $db->connect_error : 'Database: connected, MariaDB ' . $db->server_info;
          echo '<hr>';
          phpinfo();
        permissions: "0644"
    post_commands:
      - rm -f /var/www/html/index.html
      - systemctl restart apache2
